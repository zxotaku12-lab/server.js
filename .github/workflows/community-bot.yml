# The community bot is intentionally separate from Quest Bot and its secrets.
# Scheduled workflows run only on the default branch. GitHub-hosted runners are
# ephemeral: data/ is NOT preserved. See README before using this for real data.
name: Community Bot (free runner)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: read
concurrency:
  group: community-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Start community bot
        env:
          DISCORD_TOKEN: ${{ secrets.COMMUNITY_DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.COMMUNITY_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "Missing COMMUNITY_DISCORD_TOKEN secret."
            exit 1
          fi
          # Timeout leaves time for an orderly shutdown before the job limit.
          set +e
          timeout --signal=TERM 20700 node bot.js
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then exit 0; fi
          exit "$status"
